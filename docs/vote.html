<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question of the Day — preview · WorldConstitution</title>
<meta name="description" content="How the Question of the Day voting will look. Stage 2 preview.">
<style>
  :root{
    --indigo:#1e2a5a; --indigo-deep:#141b3d;
    --amber:#d98e04; --amber-hover:#b97800; --amber-soft:#fff3dc;
    --green:#2e8b57; --paper:#fbfaf7; --card:#ffffff; --line:#e8e5dd; --muted:#6b7085;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --indigo:#dfe4f5; --indigo-deep:#f0f2fa;
      --amber:#f0a71c; --amber-hover:#ffbe3d; --amber-soft:#2a2410;
      --green:#4cbf85; --paper:#12162a; --card:#1a2038; --line:#2a3152; --muted:#8d93ab;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--paper);color:var(--indigo);line-height:1.6}
  [dir="rtl"] body{font-family:-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px}

  nav{border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:12px 24px;max-width:760px;margin:0 auto;flex-wrap:wrap}
  .logo{font-weight:800;font-size:16px;color:var(--indigo);text-decoration:none;white-space:nowrap}
  .logo span{color:var(--amber)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back{font-size:14px;color:var(--amber);text-decoration:none;font-weight:600;white-space:nowrap}
  #lang{border:1px solid var(--line);background:var(--card);color:var(--indigo);border-radius:9px;
     padding:6px 9px;font-size:14px;font-family:inherit;cursor:pointer}

  .preview-banner{background:var(--amber-soft);border-bottom:1px solid var(--line);text-align:center;
     padding:11px 16px;font-size:13.5px;color:var(--indigo-deep)}
  .preview-banner b{text-transform:uppercase;font-size:12px;color:var(--amber)}

  .qwrap{padding:42px 0 56px}
  .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);
     text-transform:uppercase;letter-spacing:.1em;margin-bottom:16px}
  .meta .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
  h1{font-size:clamp(24px,4.5vw,36px);line-height:1.15;font-weight:900;color:var(--indigo-deep);margin-bottom:8px}
  .qsub{color:var(--muted);font-size:15px;margin-bottom:28px}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .opt{position:relative;border:2px solid var(--line);border-radius:14px;padding:22px 20px;cursor:pointer;
     background:var(--card);overflow:hidden;text-align:center;transition:border-color .15s}
  .opt:hover{border-color:var(--amber)}
  .opt.picked{border-color:var(--amber)}
  .opt .fill{position:absolute;inset-inline-start:0;top:0;bottom:0;width:0;background:var(--amber-soft);
     transition:width 1s cubic-bezier(.2,.7,.2,1);z-index:0}
  .opt.no .fill{background:color-mix(in srgb, var(--muted) 18%, transparent)}
  .opt .lbl,.opt .pct{position:relative;z-index:1}
  .opt .lbl{font-size:20px;font-weight:800;color:var(--indigo-deep)}
  .opt .pct{display:block;margin-top:6px;font-size:15px;font-weight:700;color:var(--muted);opacity:0;transition:opacity .4s}
  .revealed .opt .pct{opacity:1}
  .youvoted{display:none;text-align:center;font-size:14px;color:var(--green);font-weight:700;margin:6px 0 4px}
  .revealed .youvoted{display:block}
  .total{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
  .oneperson{text-align:center;font-size:13px;color:var(--muted);margin:20px 0 30px}
  .oneperson b{color:var(--indigo-deep)}

  h2{font-size:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--indigo-deep);margin:30px 0 14px;font-weight:900}
  .map{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
  .row{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:12px;font-size:14px}
  .row .bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
  .row .bar i{display:block;height:100%;background:var(--amber);width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
  .row .v{text-align:end;color:var(--muted);font-variant-numeric:tabular-nums}
  .demo-tag{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}

  .delib{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:12px}
  .delib .c{padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .delib .c:last-child{border:none;padding-bottom:0}
  .delib .who{font-weight:700;font-size:13px;color:var(--muted);margin-bottom:3px}
  .delib .who .badge{color:var(--green)}

  .how{background:var(--card);border:1px solid var(--line);border-inline-start:4px solid var(--amber);
     border-radius:12px;padding:22px;margin-top:30px;font-size:14.5px}
  .how b{color:var(--indigo-deep)}
  .how ol{margin:12px 0 0 18px}
  [dir="rtl"] .how ol{margin:12px 18px 0 0}
  .how li{margin-bottom:6px}

  footer{border-top:1px solid var(--line);padding:32px 0;text-align:center;font-size:13px;color:var(--muted)}
  footer a{color:var(--amber);text-decoration:none;font-weight:600}
  @media(max-width:520px){.opts{grid-template-columns:1fr}.row{grid-template-columns:96px 1fr 40px}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">◆ World<span>Constitution</span></a>
    <div class="nav-right">
      <select id="lang" aria-label="Language"></select>
      <a class="back" href="index.html" id="back"></a>
    </div>
  </div>
</nav>

<div class="preview-banner"><b id="banner-b"></b> <span id="banner-t"></span></div>

<section class="qwrap wrap">
  <div class="meta"><span class="dot"></span> <span id="meta"></span></div>
  <h1 id="question"></h1>
  <p class="qsub" id="qsub"></p>

  <div class="opts" id="opts">
    <div class="opt yes" data-pct="68"><div class="fill"></div><span class="lbl" id="yes"></span><span class="pct">68%</span></div>
    <div class="opt no" data-pct="32"><div class="fill"></div><span class="lbl" id="no"></span><span class="pct">32%</span></div>
  </div>
  <div class="youvoted" id="voted"></div>
  <div class="total" id="total"></div>

  <p class="oneperson"><b id="protect-t"></b> <span id="protect"></span></p>

  <h2 id="map-t"></h2>
  <div class="map" id="map">
    <div class="row"><span>🇪🇪 Estonia</span><span class="bar"><i data-w="81"></i></span><span class="v">81%</span></div>
    <div class="row"><span>🇬🇪 Georgia</span><span class="bar"><i data-w="74"></i></span><span class="v">74%</span></div>
    <div class="row"><span>🇧🇷 Brazil</span><span class="bar"><i data-w="66"></i></span><span class="v">66%</span></div>
    <div class="row"><span>🇮🇳 India</span><span class="bar"><i data-w="59"></i></span><span class="v">59%</span></div>
    <div class="row"><span>🇺🇸 USA</span><span class="bar"><i data-w="63"></i></span><span class="v">63%</span></div>
  </div>
  <div class="demo-tag" id="map-note"></div>

  <h2 id="disc-t"></h2>
  <div class="delib">
    <div class="c"><div class="who">Maria 🇬🇪 · <span class="badge" id="v1"></span> · <span id="t1"></span> 720</div><span id="d1"></span></div>
    <div class="c"><div class="who">••• · <span class="badge" id="v2"></span></div><span id="d2"></span></div>
    <div class="c"><div class="who">Samir 🇦🇪 · <span class="badge" id="v3"></span> · <span id="g1"></span></div><span id="d3"></span></div>
  </div>
  <div class="demo-tag" id="disc-note"></div>

  <div class="how">
    <b id="how-t"></b>
    <ol><li id="h1"></li><li id="h2"></li><li id="h3"></li><li id="h4"></li></ol>
    <div style="margin-top:10px" id="h-foot"></div>
  </div>
</section>

<footer class="wrap">
  <span id="f-prev"></span> · <a href="index.html" id="f-sign"></a> ·
  <a href="https://github.com/murad2026/wc" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
const $ = id => document.getElementById(id);
const LANGS = { ru:'Русский', en:'English', fr:'Français', es:'Español', zh:'中文', ar:'العربية' };
let T = null;

function pickLang(){
  const s = localStorage.getItem('wc_lang');
  if(s && LANGS[s]) return s;
  const n = (navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS[n] ? n : 'en';
}

async function setLang(code){
  try{ T = await (await fetch(`lang/${code}.json`)).json(); }
  catch(e){ if(code!=='en') return setLang('en'); return; }
  localStorage.setItem('wc_lang', code);
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir || 'ltr';
  render();
}

function render(){
  const v = T.v;
  document.title = v.question + ' · WorldConstitution';
  $('back').textContent = T.back;
  $('banner-b').textContent = v.banner;
  $('banner-t').textContent = v.bannerTxt;
  $('meta').textContent = v.meta;
  $('question').textContent = v.question;
  $('qsub').textContent = v.sub;
  $('yes').textContent = v.yes;
  $('no').textContent = v.no;
  $('voted').textContent = v.voted;
  $('total').textContent = v.hint;
  $('protect-t').textContent = v.protectT;
  $('protect').textContent = v.protect;
  $('map-t').textContent = v.mapT;
  $('map-note').textContent = v.mapNote;
  $('disc-t').textContent = v.discT;
  $('d1').textContent = v.d1; $('d2').textContent = v.d2; $('d3').textContent = v.d3;
  $('v1').textContent = v.verified; $('v2').textContent = v.verified; $('v3').textContent = v.verified;
  $('t1').textContent = v.trust; $('g1').textContent = v.guild;
  $('disc-note').textContent = v.discNote;
  $('how-t').textContent = v.howT;
  $('h1').innerHTML = v.h1; $('h2').innerHTML = v.h2; $('h3').innerHTML = v.h3; $('h4').innerHTML = v.h4;
  $('h-foot').textContent = v.hFoot;
  $('f-prev').textContent = v.fPrev;
  $('f-sign').textContent = v.fSign;
}

document.querySelectorAll('.opt').forEach(el => el.addEventListener('click', () => {
  $('opts').classList.add('revealed');
  document.querySelectorAll('.opt').forEach(o=>{
    o.classList.remove('picked');
    o.querySelector('.fill').style.width = o.dataset.pct + '%';
  });
  el.classList.add('picked');
  $('total').textContent = T.v.total;
  document.querySelectorAll('#map i').forEach(i => i.style.width = i.dataset.w + '%');
}));

const sel = $('lang');
sel.innerHTML = Object.entries(LANGS).map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
const initial = pickLang();
sel.value = initial;
sel.addEventListener('change', e => setLang(e.target.value));
setLang(initial);
</script>
</body>
</html>
