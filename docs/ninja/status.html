<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order status — Verified.Ninja</title>
<meta name="description" content="Track a Verified.Ninja order by its number.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M16%201.6c.95%206.5%207.95%2013.5%2014.4%2014.4-6.45.95-13.45%207.95-14.4%2014.4-.95-6.45-7.95-13.45-14.4-14.4%206.45-.95%2013.45-7.95%2014.4-14.4ZM16%2012.6a3.4%203.4%200%201%200%200%206.8%203.4%203.4%200%200%200%200-6.8Z%22%20fill%3D%22%231d1d1f%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="app.css">
<style>
  header.top{padding:56px 0 26px}
  header.top .lede{margin-top:14px;font-size:17px}

  .look{display:flex;gap:10px;flex-wrap:wrap}
  .look input{flex:1 1 210px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.08em;text-transform:uppercase}

  .found{display:none;margin-top:30px}
  .found.on{display:block}
  .head{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;
    padding-bottom:18px;border-bottom:1px solid var(--line-soft)}
  .head .ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:24px;font-weight:600;letter-spacing:.05em}
  .head .sv{font-size:14.5px;color:var(--muted)}

  .track{list-style:none;margin-top:26px}
  .track li{display:flex;gap:16px;padding-bottom:26px;position:relative}
  .track li:last-child{padding-bottom:0}
  .track li::after{content:"";position:absolute;left:12px;top:27px;bottom:0;width:1.5px;background:var(--line)}
  .track li:last-child::after{display:none}
  .track .pip{flex-shrink:0;width:25px;height:25px;border-radius:50%;z-index:1;
    border:1.5px solid var(--line);background:var(--bg);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
  .track li.done .pip{border-color:var(--ink);color:var(--ink)}
  .track li.now .pip{border-color:var(--ink);background:var(--ink);color:var(--bg)}
  .track .t{font-size:16px;font-weight:500;color:var(--muted)}
  .track li.done .t,.track li.now .t{color:var(--ink)}
  .track .d{font-size:14.5px;color:var(--muted);margin-top:3px;max-width:40em}

  .foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line-soft);
    font-size:13.5px;color:var(--muted)}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="brand" href="index.html">Verified<b>.Ninja</b><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M16 1.6c.95 6.5 7.95 13.5 14.4 14.4-6.45.95-13.45 7.95-14.4 14.4-.95-6.45-7.95-13.45-14.4-14.4 6.45-.95 13.45-7.95 14.4-14.4ZM16 12.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Z" fill="currentColor"/></svg></a>
    <div class="nav-links">
      <a href="expert.html" class="hide-sm" id="n-exp"></a>
      <select class="lang" id="lang" aria-label="Language"></select>
      <a class="btn sm" href="order.html" id="n-ord"></a>
    </div>
  </div>
</nav>

<div class="wrap narrow">
  <header class="top">
    <h1 id="h1"></h1>
    <p class="lede" id="sub"></p>
  </header>

  <form class="look" id="f">
    <input id="q" maxlength="9" autocomplete="off" spellcheck="false" aria-label="Order number">
    <button class="btn" id="go" type="submit"></button>
  </form>

  <div class="alert" id="err"></div>

  <div class="found" id="found">
    <div class="head">
      <span class="ref" id="ref">—</span>
      <span class="sv" id="sv"></span>
    </div>
    <ol class="track" id="track"></ol>
    <div class="foot" id="foot"></div>
  </div>
</div>

<footer class="wrap narrow">
  <div class="row">
    <span id="f-note"></span>
    <span><a href="about.html" id="f-about"></a> · <a href="join.html" id="f-join"></a></span>
  </div>
</footer>

<script src="i18n.js"></script>
<script>
const SB = {
  url:  "https://nhkwgulokiwqwfrynmkx.supabase.co",
  anon: "sb_publishable_XFFU01VfekhRJffwEEgbwA_eOvmOXr0"
};
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
const KEYS = ['received','payment_sent','paid','scheduled','call_done','delivered'];
let T = null;

function problem(msg){
  $('err').textContent = msg;
  $('err').classList.add('on');
  $('found').classList.remove('on');
}

function draw(o){
  $('err').classList.remove('on');
  const s = T.status;
  const plan = T.home.plans.find(p => p.id === o.service);
  $('ref').textContent = o.ref;
  $('sv').textContent  = plan ? plan.name + ' · ' + plan.price : o.service;

  if(o.stage === 'cancelled'){
    $('track').innerHTML = '';
    $('foot').textContent = s.cancelled;
    $('found').classList.add('on');
    return;
  }

  const at = KEYS.indexOf(o.stage);
  $('track').innerHTML = s.flow.map((step,i)=>{
    const cls = i < at ? 'done' : (i === at ? 'now' : '');
    const pip = i < at ? '✓' : (i === at ? '' : i + 1);
    return `<li class="${cls}"><span class="pip">${pip}</span>
      <span><span class="t">${esc(step.t)}</span>${i === at ? `<span class="d">${esc(step.d)}</span>` : ''}</span></li>`;
  }).join('');

  const d = new Date(o.created_at);
  $('foot').textContent = s.placed + ' ' +
    d.toLocaleDateString(document.documentElement.lang || undefined,
      { year:'numeric', month:'long', day:'numeric' }) + ' · ' + s.questions;
  $('found').classList.add('on');
}

async function look(ref){
  const s = T.status;
  $('found').classList.remove('on');
  $('go').disabled = true;
  try{
    /* Только безличные поля. Почта и имя клиента анониму не отдаются
       ни при каком запросе — это закрыто правами на колонки в базе. */
    const url = `${SB.url}/rest/v1/orders?ref=eq.${encodeURIComponent(ref)}`
              + `&select=ref,service,stage,created_at&limit=1`;
    const r = await fetch(url, { headers:{ apikey:SB.anon, Authorization:`Bearer ${SB.anon}` } });
    if(!r.ok) throw new Error(r.status);
    const rows = await r.json();
    if(!rows.length) return problem(s.errNone);
    draw(rows[0]);
  }catch(e){
    problem(s.errNet);
  }finally{
    $('go').disabled = false;
  }
}

window.render = function(t){
  T = t;
  const s = T.status;
  document.title = s.h1 + ' — Verified.Ninja';
  $('n-exp').textContent = T.nav.experts;
  $('n-ord').textContent = T.nav.order;
  $('h1').textContent  = s.h1;
  $('sub').textContent = s.sub;
  $('q').placeholder   = s.ph;
  $('go').textContent  = s.go;
  $('f-note').textContent = T.footer.note;
  if($('f-about')) $('f-about').textContent = T.nav.about;
  if($('f-join'))  $('f-join').textContent  = T.nav.join;

  const fromUrl = new URLSearchParams(location.search).get('ref');
  let seed = fromUrl;
  if(!seed){ try{ seed = localStorage.getItem('vn_ref'); }catch(e){} }
  if(seed && !$('q').value) $('q').value = seed;
  if(fromUrl) look(fromUrl.toUpperCase());
};

$('f').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('q').value.trim().toUpperCase();
  if(!/^VN-[A-Z0-9]{6}$/.test(v)) return problem(T.status.errFormat);
  look(v);
});
</script>
</body>
</html>
