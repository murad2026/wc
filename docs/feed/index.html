<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Feed · WorldConstitution</title>
<meta name="description" content="Тезис и карточки тех, кто проверял его на себе.">
<style>
  :root{
    --amber:#d98e04; --paper:#fbfaf7; --card:#ffffff;
    --line:#e8e5dd; --muted:#6b7085; --ink:#1e2a5a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --amber:#f0a71c; --paper:#12162a; --card:#1a2038;
      --line:#2a3152; --muted:#8d93ab; --ink:#dfe4f5;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  a{color:var(--amber)}

  nav{border-bottom:1px solid var(--line);background:var(--card)}
  .nav-inner{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:14px}
  .logo{font-weight:700;color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap}
  .logo span{color:var(--amber)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
  select{background:var(--paper);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:5px 8px;font:inherit;font-size:13.5px}

  header{padding:44px 0 8px}
  h1{font-size:30px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
  .lead{margin-top:14px;color:var(--muted);font-size:16.5px}

  .what{margin-top:26px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:20px}
  .what h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:10px}
  .what p{font-size:15px;line-height:1.55}
  .what p + p{margin-top:9px}

  .list{margin-top:30px;display:flex;flex-direction:column;gap:12px}
  .item{display:block;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:20px;text-decoration:none;color:inherit}
  .item:hover{border-color:var(--amber)}
  .item .n{font-size:12px;color:var(--muted);letter-spacing:.05em}
  .item .t{margin-top:7px;font-size:17px;font-weight:600;line-height:1.35}
  .item .m{margin-top:10px;font-size:13.5px;color:var(--muted)}

  footer{margin-top:54px;border-top:1px solid var(--line);background:var(--card)}
  .foot{max-width:720px;margin:0 auto;padding:24px 20px 40px;
    font-size:13.5px;line-height:1.6;color:var(--muted)}
  .foot p + p{margin-top:8px}
  .foot .links{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">◆ World<span>Constitution</span></a>
    <div class="nav-right">
      <select id="lang" aria-label="Language"></select>
      <a class="back" href="../index.html" id="back"></a>
    </div>
  </div>
</nav>

<header class="wrap">
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
</header>

<section class="wrap">
  <div class="what">
    <h2 id="how-t"></h2>
    <div id="how"></div>
  </div>

  <div class="list">
    <a class="item" href="claims/001.html">
      <div class="n" id="i-kicker"></div>
      <div class="t" id="i-thesis"></div>
      <div class="m" id="i-meta"></div>
    </a>
  </div>
</section>

<footer>
  <div class="foot">
    <div id="foot"></div>
    <div class="links">
      <a href="https://github.com/murad2026/wc" id="l-repo"></a>
      <a href="log.json">log.json</a>
      <a href="https://github.com/murad2026/wc/blob/main/FEED.md">FEED.md</a>
      <a href="https://github.com/murad2026/wc/blob/main/CONSTITUTION.md" id="l-rules"></a>
    </div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const LANGS = { en:'English', fr:'Français', es:'Español', ru:'Русский', zh:'中文', ar:'العربية' };
const LANG_PATH = '../lang/';
let T = null;

function pickLang(){
  const s = localStorage.getItem('wc_lang');
  if(s && LANGS[s]) return s;
  const n = (navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS[n] ? n : 'en';
}

async function setLang(code){
  try{ T = await (await fetch(`${LANG_PATH}${code}.json`)).json(); }
  catch(e){ if(code!=='en') return setLang('en'); return; }
  localStorage.setItem('wc_lang', code);
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir || 'ltr';
  render();
}

function render(){
  const f = T.feed;
  document.title = f.title + ' · WorldConstitution';
  $('back').textContent = f.backMain;

  $('title').textContent = f.title;
  $('lead').textContent  = f.lead;

  $('how-t').textContent = f.howT;
  /* how содержит <b> в тексте — это наша собственная разметка, не ввод извне */
  $('how').innerHTML = f.how.map(p => `<p>${p}</p>`).join('');

  $('i-kicker').textContent = f.kicker;
  $('i-thesis').textContent = f.thesis;
  $('i-meta').textContent   = f.claimMeta;

  $('foot').innerHTML = f.foot.map(p => `<p>${esc(p)}</p>`).join('');
  $('l-repo').textContent  = f.fRepo;
  $('l-rules').textContent = f.fRules;
}

const sel = $('lang');
sel.innerHTML = Object.entries(LANGS).map(([c,n]) => `<option value="${c}">${n}</option>`).join('');
const initial = pickLang();
sel.value = initial;
sel.addEventListener('change', e => setLang(e.target.value));
setLang(initial);
</script>

</body>
</html>
