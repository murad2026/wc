<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ответить · Verified Feed</title>
<meta name="description" content="Три пути ответа: свой случай, несогласие с фразой в тексте или «не понял / не было случая».">
<style>
  :root{
    --amber:#d98e04; --paper:#fbfaf7; --card:#ffffff;
    --line:#e8e5dd; --muted:#6b7085; --ink:#1e2a5a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --amber:#f0a71c; --paper:#12162a; --card:#1a2038;
      --line:#2a3152; --muted:#8d93ab; --ink:#dfe4f5;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  a{color:var(--amber)}

  nav{border-bottom:1px solid var(--line);background:var(--card)}
  .nav-inner{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:14px}
  .logo{font-weight:700;color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap}
  .logo span{color:var(--amber)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
  select.lang-sel{background:var(--paper);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:5px 8px;font:inherit;font-size:13.5px;width:auto}

  header{padding:40px 0 0}
  h1{font-size:27px;line-height:1.25;letter-spacing:-.02em;font-weight:700}
  .lead{margin-top:13px;color:var(--muted);font-size:16px}

  form{margin-top:28px}
  fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:20px;margin-bottom:16px}
  legend{padding:0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:600}
  .f{margin-bottom:16px}
  .f:last-child{margin-bottom:0}
  label{display:block;font-size:14.5px;font-weight:600;margin-bottom:6px}
  .hint{font-size:13px;color:var(--muted);margin:-3px 0 7px;line-height:1.5}
  input[type=text],textarea{width:100%;background:var(--paper);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px}
  textarea{min-height:76px;resize:vertical}
  .radios{display:flex;flex-wrap:wrap;gap:8px}
  .radios label{display:inline-flex;align-items:center;gap:7px;font-weight:400;
    font-size:14.5px;border:1px solid var(--line);border-radius:8px;padding:8px 13px;
    background:var(--paper);cursor:pointer;margin:0}
  .radios input{margin:0}

  .btn{background:var(--amber);color:#fff;border:0;border-radius:9px;
    font:inherit;font-weight:600;font-size:15px;padding:12px 24px;cursor:pointer}
  .out{margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:18px;display:none}
  .out.on{display:block}
  .out h3{font-size:14px;margin-bottom:10px}
  .out pre{white-space:pre-wrap;word-wrap:break-word;text-align:start;
    font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
    background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:14px;max-height:340px;overflow:auto}
  .out .where{margin-top:12px;font-size:14px;line-height:1.55}

  .no{margin-top:22px;background:var(--card);border:1px solid var(--line);
    border-inline-start:3px solid var(--muted);border-radius:10px;padding:16px 18px;
    font-size:14.5px;line-height:1.55;color:var(--muted)}

  footer{margin-top:54px;border-top:1px solid var(--line);background:var(--card)}
  .foot{max-width:720px;margin:0 auto;padding:24px 20px 40px;
    font-size:13.5px;line-height:1.6;color:var(--muted)}
  .foot p + p{margin-top:8px}
  .foot .links{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px}
  .cnote{margin-top:14px;font-size:13.5px;color:var(--muted);line-height:1.5}
  .dim{opacity:.42;transition:opacity .18s}
  .dim-note{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../index.html">◆ World<span>Constitution</span></a>
    <div class="nav-right">
      <select class="lang-sel" id="lang" aria-label="Language"></select>
      <a class="back" href="claims/001.html" id="back"></a>
    </div>
  </div>
</nav>

<header class="wrap">
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
</header>

<section class="wrap">
<form id="f">

  <fieldset>
    <legend id="leg-path"></legend>
    <div class="f">
      <label id="l1"></label>
      <div class="radios" id="r1"></div>
      <p class="dim-note" id="dim-note"></p>
    </div>
    <div class="f" id="f2">
      <label id="l2"></label>
      <div class="hint" id="h2"></div>
      <textarea name="q2"></textarea>
    </div>
    <div class="f" id="f19">
      <label id="l19"></label>
      <textarea name="q19"></textarea>
    </div>
    <p class="cnote" id="c-note"></p>
  </fieldset>

  <fieldset id="fs-case">
    <legend id="leg-case"></legend>
    <div class="f"><label id="l3"></label><div class="hint" id="h3"></div><textarea name="q3" maxlength="400"></textarea></div>
    <div class="f"><label id="l4"></label><div class="hint" id="h4"></div><input type="text" name="q4" maxlength="40"></div>
    <div class="f"><label id="l5"></label><div class="hint" id="h5"></div><input type="text" name="q5" maxlength="200"></div>
    <div class="f"><label id="l6"></label><textarea name="q6"></textarea></div>
    <div class="f"><label id="l7"></label><textarea name="q7"></textarea></div>
    <div class="f"><label id="l8"></label><div class="hint" id="h8"></div><div class="radios" id="r8"></div></div>
    <div class="f"><label id="l9"></label><div class="radios" id="r9"></div></div>
    <div class="f"><label id="l10"></label><div class="hint" id="h10"></div><input type="text" name="q10" maxlength="60"></div>
    <div class="f"><label id="l11"></label><div class="hint" id="h11"></div><textarea name="q11"></textarea></div>
    <div class="f"><label id="l12"></label><div class="hint" id="h12"></div><textarea name="q12"></textarea></div>
  </fieldset>

  <fieldset>
    <legend id="leg-sign"></legend>
    <div class="f" id="f13"><label id="l13"></label><div class="hint" id="h13"></div><textarea name="q13"></textarea></div>
    <div class="f"><label id="l14"></label><div class="hint" id="h14"></div><input type="text" name="q14" maxlength="60"></div>
    <div class="f" id="f15"><label id="l15"></label><div class="hint" id="h15"></div><div class="radios" id="r15"></div></div>
    <div class="f" id="f16"><label id="l16"></label><textarea name="q16"></textarea></div>
    <div class="f"><label id="l17"></label><div class="hint" id="h17"></div><input type="text" name="q17" maxlength="120"></div>
  </fieldset>

  <fieldset>
    <legend id="leg-opt"></legend>
    <div class="f">
      <label id="l18"></label>
      <div class="hint" id="h18"></div>
      <textarea name="q18"></textarea>
    </div>
  </fieldset>

  <button class="btn" type="submit" id="submit"></button>
</form>

<div class="out" id="out">
  <h3 id="out-t"></h3>
  <pre id="text"></pre>
  <p class="where"><span id="where"></span> <b id="addr"></b></p>
</div>

<div class="no" id="no-bottom"></div>
</section>

<footer>
  <div class="foot">
    <div id="foot"></div>
    <div class="links">
      <a href="https://github.com/murad2026/wc" id="l-repo"></a>
      <a href="log.json">log.json</a>
      <a href="https://github.com/murad2026/wc/blob/main/FEED.md">FEED.md</a>
      <a href="https://github.com/murad2026/wc/blob/main/CONSTITUTION.md" id="l-rules"></a>
    </div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const LANGS = { en:'English', fr:'Français', es:'Español', ru:'Русский', zh:'中文', ar:'العربية' };
const LANG_PATH = '../lang/';
let T = null;

function pickLang(){
  const s = localStorage.getItem('wc_lang');
  if(s && LANGS[s]) return s;
  const n = (navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS[n] ? n : 'en';
}

async function setLang(code){
  try{ T = await (await fetch(`${LANG_PATH}${code}.json`)).json(); }
  catch(e){ if(code!=='en') return setLang('en'); return; }
  localStorage.setItem('wc_lang', code);
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir || 'ltr';
  render();
}

/* Радиогруппа: первый вариант выбран по умолчанию, кроме 8-го и 9-го полей,
   где по умолчанию стоит наименее обязывающий ответ. */
function radios(box, name, opts, checked, values){
  $(box).innerHTML = opts.map((o,i) =>
    `<label><input type="radio" name="${name}" value="${esc(values ? values[i] : o)}"${i===checked?' checked':''}> ${esc(o)}</label>`
  ).join('');
}

/* Путь хранится кодом, а не подписью: подпись переводится, код нет.
   На C поля эпизода перестают быть обязательными — это помечается,
   а не прячется: человек на C всё равно может что-то рассказать. */
const PATHS = ['A','B','C','D'];

/* Что относится к делу на каждом пути. Гасим только видом: поля остаются
   рабочими, иначе набранный текст пропал бы при переключении пути —
   disabled-поля не попадают в FormData. */
const RELEVANT = {
  A: { f2:0, f19:0, 'fs-case':1, f13:1, f15:1, f16:1 },
  B: { f2:1, f19:0, 'fs-case':1, f13:1, f15:1, f16:1 },
  C: { f2:0, f19:1, 'fs-case':0, f13:0, f15:0, f16:0 },
  D: { f2:0, f19:1, 'fs-case':0, f13:0, f15:0, f16:0 },
};

function onPath(){
  const v = document.querySelector('input[name=q1]:checked');
  const map = RELEVANT[v ? v.value : 'A'] || RELEVANT.A;
  for(const id in map) $(id).classList.toggle('dim', !map[id]);
}

function render(){
  const f = T.feed;
  document.title = f.rTitle + ' · Verified Feed';
  $('back').textContent = f.backClaim;

  $('title').textContent = f.rTitle;
  $('lead').textContent  = f.rLead;

  $('leg-path').textContent = f.legPath;
  $('leg-case').textContent = f.legCase;
  $('leg-sign').textContent = f.legSign;
  $('leg-opt').textContent  = f.legOpt;

  for(let i = 1; i <= 18; i++) $('l' + i).textContent = f.l[i-1];

  $('h2').textContent  = f.h2;
  $('h3').textContent  = f.h3;
  $('h4').textContent  = f.h4;
  $('h5').textContent  = f.h5;
  $('h8').textContent  = f.h8;
  $('h13').textContent = f.h13;
  $('h10').textContent = f.h10;
  $('h11').textContent = f.h11;
  $('h12').textContent = f.h12;
  $('h14').textContent = f.h14;
  $('h15').textContent = f.h15;
  $('h17').textContent = f.h17;
  $('h18').innerHTML   = f.h18;   /* содержит <b> из нашего же словаря */
  $('l19').textContent    = f.l19;
  $('c-note').textContent = f.cNote;
  $('dim-note').textContent = f.dimNote;

  radios('r1',  'q1',  f.oPath,  0, PATHS);
  $('r1').addEventListener('change', onPath);
  radios('r8',  'q8',  f.oHuman, 2);
  radios('r9',  'q9',  f.oOut,   3);
  radios('r15', 'q15', f.oPub,   0);

  $('submit').textContent    = f.submit;
  $('out-t').textContent     = f.outT;
  $('where').textContent     = f.where;
  $('addr').textContent      = f.addr;
  $('no-bottom').textContent = f.noBottom;

  $('foot').innerHTML = f.foot.map(p => `<p>${esc(p)}</p>`).join('');
  $('l-repo').textContent  = f.fRepo;
  $('l-rules').textContent = f.fRules;

  onPath();
}

$('f').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = T.feed;
  const fd = new FormData(ev.target);
  const lines = [f.outHead, ''];
  const code = (fd.get('q1') || '').toString();
  const pathLabel = f.oPath[PATHS.indexOf(code)] || code;
  for(let i = 1; i <= 19; i++){
    let v = (fd.get('q' + i) || '').toString().trim();
    if(i === 1) v = pathLabel;
    const label = i === 19 ? f.l19 : f.l[i-1];
    lines.push(i + '. ' + label + ': ' + (v || '—'));
  }
  $('text').textContent = lines.join('\n');
  $('out').classList.add('on');
  $('out').scrollIntoView({behavior:'smooth', block:'start'});
});

const sel = $('lang');
sel.innerHTML = Object.entries(LANGS).map(([c,n]) => `<option value="${c}">${n}</option>`).join('');
const initial = pickLang();
sel.value = initial;
sel.addEventListener('change', e => setLang(e.target.value));
setLang(initial);
</script>

</body>
</html>
