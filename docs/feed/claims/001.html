<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>001 · Verified Feed</title>
<meta name="description" content="Крупный сервис может закрыть многолетний аккаунт без разбора конкретного материала с человеком на том конце.">
<style>
  :root{
    --amber:#d98e04; --green:#2e8b57; --paper:#fbfaf7; --card:#ffffff;
    --line:#e8e5dd; --muted:#6b7085; --ink:#1e2a5a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --amber:#f0a71c; --green:#4cbf85; --paper:#12162a; --card:#1a2038;
      --line:#2a3152; --muted:#8d93ab; --ink:#dfe4f5;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  a{color:var(--amber)}

  nav{border-bottom:1px solid var(--line);background:var(--card)}
  .nav-inner{max-width:720px;margin:0 auto;padding:14px 20px;display:flex;
    align-items:center;justify-content:space-between;gap:14px}
  .logo{font-weight:700;color:var(--ink);text-decoration:none;font-size:15px;white-space:nowrap}
  .logo span{color:var(--amber)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back{color:var(--muted);text-decoration:none;font-size:14px;white-space:nowrap}
  select{background:var(--paper);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:5px 8px;font:inherit;font-size:13.5px}

  header{padding:40px 0 0}
  .kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{margin-top:10px;font-size:25px;line-height:1.3;letter-spacing:-.015em;font-weight:700}

  .card{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
  .card-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding-bottom:14px;border-bottom:1px solid var(--line)}
  .badge{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--green);border:1px solid var(--green);border-radius:20px;padding:3px 11px}
  .cno{font-size:12.5px;color:var(--muted)}

  .row{padding:15px 0;border-bottom:1px solid var(--line)}
  .row:last-of-type{border-bottom:0}
  .row .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:600;margin-bottom:7px}
  .row .v{font-size:15.5px;line-height:1.6}

  .sig{margin-top:18px;padding-top:15px;border-top:1px solid var(--line);
    display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--muted)}
  .sig b{color:var(--ink);font-weight:600}

  h2{margin-top:40px;font-size:19px;letter-spacing:-.01em}
  .ways{margin-top:16px;display:flex;flex-direction:column;gap:12px}
  .way{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .way .l{font-size:13px;font-weight:700;color:var(--amber);letter-spacing:.06em}
  .way .t{margin-top:6px;font-size:15.5px;line-height:1.55}
  .note{margin-top:14px;font-size:14px;color:var(--muted);line-height:1.55}
  .cta{display:inline-block;margin-top:20px;background:var(--amber);color:#fff;
    text-decoration:none;font-weight:600;font-size:15px;padding:11px 22px;border-radius:9px}

  footer{margin-top:54px;border-top:1px solid var(--line);background:var(--card)}
  .foot{max-width:720px;margin:0 auto;padding:24px 20px 40px;
    font-size:13.5px;line-height:1.6;color:var(--muted)}
  .foot p + p{margin-top:8px}
  .foot .links{margin-top:12px;display:flex;flex-wrap:wrap;gap:14px}
  .intro{margin-top:22px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:18px 20px}
  .intro p{font-size:15.5px;line-height:1.5}
  .intro p + p{margin-top:6px}
  .intro p:last-child{margin-top:10px;color:var(--muted)}

  details.letters{margin-top:12px;border:1px solid var(--line);border-radius:10px;
    background:var(--paper)}
  details.letters summary{cursor:pointer;padding:11px 15px;font-size:14px;font-weight:600;
    color:var(--muted);list-style:none}
  details.letters summary::-webkit-details-marker{display:none}
  details.letters summary::before{content:'▸ ';font-size:12px}
  details.letters[open] summary::before{content:'▾ '}
  details.letters .body{padding:0 15px 15px;font-size:15px;line-height:1.6}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="../../index.html">◆ World<span>Constitution</span></a>
    <div class="nav-right">
      <select id="lang" aria-label="Language"></select>
      <a class="back" href="../index.html" id="back"></a>
    </div>
  </div>
</nav>

<header class="wrap">
  <div class="kicker" id="kicker"></div>
  <h1 id="thesis"></h1>
</header>

<section class="wrap">
  <div class="intro" id="intro"></div>

  <div class="card">
    <div class="card-top">
      <span class="badge" id="verdict"></span>
      <span class="cno" id="cno"></span>
    </div>

    <div class="row">
      <div class="k" id="ep-l"></div>
      <div class="v" id="ep-short"></div>
      <details class="letters">
        <summary id="let-t"></summary>
        <div class="body" id="ep-full"></div>
      </details>
    </div>

    <div class="row">
      <div class="k" id="bo-l"></div>
      <div class="v" id="bo-v"></div>
    </div>

    <div class="row">
      <div class="k" id="pr-l"></div>
      <div class="v" id="pr-v"></div>
    </div>

    <div class="sig" id="sig"></div>
  </div>

  <h2 id="ways-t"></h2>

  <div class="ways">
    <div class="way">
      <div class="l">A</div>
      <div class="t" id="way-a"></div>
    </div>
    <div class="way">
      <div class="l">B</div>
      <div class="t" id="way-b"></div>
    </div>
    <div class="way">
      <div class="l">C</div>
      <div class="t" id="way-c"></div>
    </div>
    <div class="way">
      <div class="l">D</div>
      <div class="t" id="way-d"></div>
    </div>
  </div>

  <p class="note" id="no-comment"></p>

  <a class="cta" href="../respond.html" id="cta"></a>
</section>

<footer>
  <div class="foot">
    <div id="foot"></div>
    <div class="links">
      <a href="https://github.com/murad2026/wc" id="l-repo"></a>
      <a href="../log.json">log.json</a>
      <a href="https://github.com/murad2026/wc/blob/main/FEED.md">FEED.md</a>
      <a href="https://github.com/murad2026/wc/blob/main/CONSTITUTION.md" id="l-rules"></a>
    </div>
  </div>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const LANGS = { en:'English', fr:'Français', es:'Español', ru:'Русский', zh:'中文', ar:'العربية' };
const LANG_PATH = '../../lang/';
let T = null;

function pickLang(){
  const s = localStorage.getItem('wc_lang');
  if(s && LANGS[s]) return s;
  const n = (navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS[n] ? n : 'en';
}

async function setLang(code){
  try{ T = await (await fetch(`${LANG_PATH}${code}.json`)).json(); }
  catch(e){ if(code!=='en') return setLang('en'); return; }
  localStorage.setItem('wc_lang', code);
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir || 'ltr';
  render();
}

function render(){
  const f = T.feed;
  document.title = f.kicker + ' · Verified Feed';
  $('back').textContent = f.backAll;

  $('kicker').textContent  = f.kicker;
  $('thesis').textContent  = f.thesis;

  $('verdict').textContent = f.verdict;
  $('cno').textContent     = f.cardNo;

  $('intro').innerHTML = f.intro.map(p => `<p>${esc(p)}</p>`).join('');

  $('ep-l').textContent     = f.episodeL;
  $('ep-short').textContent = f.episodeShort;
  $('let-t').textContent    = f.lettersT;
  $('ep-full').textContent  = f.episode;
  $('bo-l').textContent = f.boundL;    $('bo-v').textContent = f.bound;
  $('pr-l').textContent = f.priceL;    $('pr-v').textContent = f.price;

  $('sig').innerHTML =
    `<span>${esc(f.sigL)}: <b>${esc(f.sigV)}</b></span>` +
    `<span>${esc(f.realL)}: <b>${esc(f.realV)}</b></span>` +
    `<span>${esc(f.hideL)}: ${esc(f.hideV)}</span>`;

  $('ways-t').textContent    = f.waysT;
  $('way-a').textContent     = f.wayA;
  $('way-b').textContent     = f.wayB;
  $('way-c').textContent     = f.wayC;
  $('way-d').textContent     = f.wayD;
  $('no-comment').textContent = f.noteComment;
  $('cta').textContent       = f.cta;

  $('foot').innerHTML = f.foot.map(p => `<p>${esc(p)}</p>`).join('');
  $('l-repo').textContent  = f.fRepo;
  $('l-rules').textContent = f.fRules;
}

const sel = $('lang');
sel.innerHTML = Object.entries(LANGS).map(([c,n]) => `<option value="${c}">${n}</option>`).join('');
const initial = pickLang();
sel.value = initial;
sel.addEventListener('change', e => setLang(e.target.value));
setLang(initial);
</script>

</body>
</html>
