<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market · WorldConstitution</title>
<meta name="description" content="What the project is made of: the foundation and the commercial layers that prove it works.">
<style>
  :root{
    --indigo:#1e2a5a; --indigo-deep:#141b3d;
    --amber:#d98e04; --amber-hover:#b97800; --amber-soft:#fff3dc;
    --green:#2e8b57; --paper:#fbfaf7; --card:#ffffff; --line:#e8e5dd; --muted:#6b7085;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --indigo:#dfe4f5; --indigo-deep:#f0f2fa;
      --amber:#f0a71c; --amber-hover:#ffbe3d; --amber-soft:#2a2410;
      --green:#4cbf85; --paper:#12162a; --card:#1a2038; --line:#2a3152; --muted:#8d93ab;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--paper);color:var(--indigo);line-height:1.6}
  [dir="rtl"] body{font-family:-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:0 24px}

  nav{border-bottom:1px solid var(--line);position:sticky;top:0;
      background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(10px);z-index:20}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:12px 24px;max-width:820px;margin:0 auto;flex-wrap:wrap}
  .logo{font-weight:800;font-size:16px;color:var(--indigo);text-decoration:none;white-space:nowrap}
  .logo span{color:var(--amber)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back{font-size:14px;color:var(--amber);text-decoration:none;font-weight:600;white-space:nowrap}
  #lang{border:1px solid var(--line);background:var(--card);color:var(--indigo);border-radius:9px;
     padding:6px 9px;font-size:14px;font-family:inherit;cursor:pointer}

  header{padding:56px 0 12px;text-align:center}
  h1{font-size:clamp(30px,5.5vw,48px);font-weight:900;text-transform:uppercase;color:var(--indigo-deep);line-height:1.05}
  .lead{margin:20px auto 0;max-width:640px;font-size:clamp(16px,2.3vw,19px);color:var(--indigo);
     border-inline-start:4px solid var(--amber);padding-inline-start:18px;text-align:start}

  h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--indigo-deep);
     margin:52px 0 18px;font-weight:900}

  .layer{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin-bottom:12px;
     position:relative;overflow:hidden}
  .layer.base{border-inline-start:5px solid var(--indigo-deep)}
  .layer.now{border-inline-start:5px solid var(--amber)}
  .layer.later{border-inline-start:5px solid var(--line)}
  .layer .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .layer .lv{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .layer .name{font-size:20px;font-weight:900;color:var(--indigo-deep)}
  .layer .tag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
     border-radius:99px;padding:3px 11px;margin-inline-start:auto;white-space:nowrap}
  .tag.live{background:color-mix(in srgb, var(--green) 16%, transparent);color:var(--green)}
  .tag.building{background:var(--amber-soft);color:var(--amber)}
  .tag.later{background:color-mix(in srgb, var(--muted) 14%, transparent);color:var(--muted)}
  .layer .desc{font-size:15.5px;margin-bottom:10px}
  .layer .proves{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
  .layer .proves b{color:var(--indigo-deep);font-weight:700}

  .why p{font-size:16px;margin-bottom:14px}
  .why p:last-child{margin-bottom:0}

  .honest{border:1px dashed var(--line);border-radius:14px;padding:20px 22px;margin-top:16px;
     font-size:14.5px;color:var(--muted)}
  .honest b{color:var(--indigo-deep);display:block;margin-bottom:6px;font-size:13px;
     text-transform:uppercase;letter-spacing:.08em}

  .cta-wrap{text-align:center;margin:48px 0 10px}
  .btn{background:var(--amber);color:#fff;border:none;cursor:pointer;font-weight:700;font-size:16px;
       padding:14px 30px;border-radius:11px;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--amber-hover)}
  .cta-note{font-size:13px;color:var(--muted);margin-top:14px;max-width:520px;margin-inline:auto}

  footer{border-top:1px solid var(--line);padding:32px 0;text-align:center;font-size:13px;color:var(--muted);margin-top:40px}
  footer a{color:var(--amber);text-decoration:none;font-weight:600}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">◆ World<span>Constitution</span></a>
    <div class="nav-right">
      <select id="lang" aria-label="Language"></select>
      <a class="back" href="index.html" id="back"></a>
    </div>
  </div>
</nav>

<header class="wrap">
  <h1 id="title"></h1>
  <p class="lead" id="lead"></p>
</header>

<section class="wrap">
  <h2 id="struct-t"></h2>
  <div id="layers"></div>

  <h2 id="why-t"></h2>
  <div class="why" id="why"></div>

  <div class="honest"><b id="honest-t"></b><span id="honest"></span></div>

  <div class="cta-wrap">
    <a class="btn" href="https://verified.ninja" target="_blank" rel="noopener" id="cta"></a>
    <p class="cta-note" id="cta-note"></p>
  </div>
</section>

<footer class="wrap">
  <a href="index.html" id="f-home"></a> · <a href="karma.html" id="f-karma"></a> ·
  <a href="https://github.com/murad2026/wc" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const LANGS = { en:'English', fr:'Français', es:'Español', ru:'Русский', zh:'中文', ar:'العربية' };
let T = null;

function pickLang(){
  const s = localStorage.getItem('wc_lang');
  if(s && LANGS[s]) return s;
  const n = (navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS[n] ? n : 'en';
}

async function setLang(code){
  try{ T = await (await fetch(`lang/${code}.json`)).json(); }
  catch(e){ if(code!=='en') return setLang('en'); return; }
  localStorage.setItem('wc_lang', code);
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir || 'ltr';
  render();
}

function render(){
  const m = T.m;
  document.title = m.title + ' · WorldConstitution';
  $('back').textContent = T.back;
  $('title').textContent = m.title;
  $('lead').textContent = m.lead;
  $('struct-t').textContent = m.structT;

  const cls = ['base','now','later','later'];
  const tagCls = ['live','building','later','later'];
  $('layers').innerHTML = m.layers.map((l,i)=>`
    <div class="layer ${cls[i]||'later'}">
      <div class="top">
        <span class="lv">${esc(l.n)}</span>
        <span class="name">${esc(l.name)}</span>
        <span class="tag ${tagCls[i]||'later'}">${esc(l.tag)}</span>
      </div>
      <div class="desc">${esc(l.desc)}</div>
      <div class="proves">${esc(l.proves)}</div>
    </div>`).join('');

  $('why-t').textContent = m.whyT;
  $('why').innerHTML = m.why.map(p=>`<p>${esc(p)}</p>`).join('');
  $('honest-t').textContent = m.honestT;
  $('honest').textContent = m.honest;
  $('cta').textContent = m.cta;
  $('cta-note').textContent = m.ctaNote;
  $('f-home').textContent = T.back;
  $('f-karma').textContent = T.k.title;
}

const sel = $('lang');
sel.innerHTML = Object.entries(LANGS).map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
const initial = pickLang();
sel.value = initial;
sel.addEventListener('change', e => setLang(e.target.value));
setLang(initial);
</script>
</body>
</html>
