<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karma · WorldConstitution</title>
<meta name="description" content="How to build karma, how it is verified, and how it relates to money.">
<style>
  :root{
    --indigo:#1e2a5a; --indigo-deep:#141b3d;
    --amber:#d98e04; --amber-hover:#b97800; --amber-soft:#fff3dc;
    --green:#2e8b57; --paper:#fbfaf7; --card:#ffffff; --line:#e8e5dd; --muted:#6b7085;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --indigo:#dfe4f5; --indigo-deep:#f0f2fa;
      --amber:#f0a71c; --amber-hover:#ffbe3d; --amber-soft:#2a2410;
      --green:#4cbf85; --paper:#12162a; --card:#1a2038; --line:#2a3152; --muted:#8d93ab;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--paper);color:var(--indigo);line-height:1.6}
  [dir="rtl"] body{font-family:-apple-system,"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif}
  .wrap{max-width:780px;margin:0 auto;padding:0 24px}

  nav{border-bottom:1px solid var(--line);position:sticky;top:0;
      background:color-mix(in srgb, var(--paper) 90%, transparent);backdrop-filter:blur(10px);z-index:20}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;
     padding:12px 24px;max-width:780px;margin:0 auto;flex-wrap:wrap}
  .logo{font-weight:800;font-size:16px;color:var(--indigo);text-decoration:none;white-space:nowrap}
  .logo span{color:var(--amber)}
  .nav-right{display:flex;align-items:center;gap:12px}
  .back{font-size:14px;color:var(--amber);text-decoration:none;font-weight:600;white-space:nowrap}
  #lang{border:1px solid var(--line);background:var(--card);color:var(--indigo);border-radius:9px;
     padding:6px 9px;font-size:14px;font-family:inherit;cursor:pointer}

  header{padding:52px 0 30px;text-align:center}
  h1{font-size:clamp(28px,5vw,44px);font-weight:900;text-transform:uppercase;color:var(--indigo-deep);line-height:1.1}
  .sub{margin:16px auto 0;max-width:600px;color:var(--muted);font-size:16.5px}

  h2{font-size:15px;text-transform:uppercase;letter-spacing:.09em;color:var(--indigo-deep);
     margin:44px 0 16px;font-weight:900}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:10px;
     display:flex;gap:16px;align-items:flex-start}
  .item .n{flex-shrink:0;width:32px;height:32px;border-radius:9px;background:var(--amber-soft);color:var(--amber);
     font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
  .item b{display:block;color:var(--indigo-deep);font-size:16px;margin-bottom:3px}
  .item span{font-size:14.5px;color:var(--muted)}

  /* батарея кармы */
  .batt{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;text-align:center}
  .batt svg{width:100%;max-width:340px;height:auto}
  .batt .lvl{font-size:19px;font-weight:900;color:var(--indigo-deep);margin-top:14px}
  .batt .hint{font-size:14px;color:var(--muted);margin-top:4px}
  .segs{margin-top:16px}
  .seg{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 18px;margin-bottom:9px;
     display:flex;gap:14px;align-items:flex-start;text-align:start}
  .seg.on{border-color:var(--green);background:color-mix(in srgb, var(--green) 6%, var(--card))}
  .seg .dot{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:color-mix(in srgb, var(--muted) 14%, transparent);
     color:var(--muted);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
  .seg.on .dot{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green)}
  .seg b{display:block;color:var(--indigo-deep);font-size:15.5px;margin-bottom:2px}
  .seg .need{font-size:14px;color:var(--muted)}
  .seg .opens{font-size:13.5px;color:var(--muted);margin-top:5px}
  .seg .opens i{font-style:normal;color:var(--amber);font-weight:700}

  .glow{border:1px dashed var(--line);border-radius:14px;padding:20px 22px;margin-top:14px;font-size:14.5px;color:var(--muted)}
  .glow b{color:var(--indigo-deep);display:block;margin-bottom:6px;font-size:13px;
     text-transform:uppercase;letter-spacing:.08em}

  .money{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--amber);
     border-radius:14px;padding:24px 26px}
  .money p{margin-bottom:12px;font-size:15.5px}
  .money p:last-child{margin-bottom:0}
  .money b{color:var(--indigo-deep)}

  .warn{border:1px dashed var(--line);border-radius:14px;padding:20px 22px;margin-top:14px;
     font-size:14.5px;color:var(--muted)}
  .warn b{color:var(--indigo-deep);display:block;margin-bottom:6px;font-size:13px;
     text-transform:uppercase;letter-spacing:.08em}

  ul.cant{list-style:none;margin-top:4px}
  ul.cant li{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 16px;
     margin-bottom:8px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
  ul.cant li::before{content:"✕";color:#c0392b;font-weight:800;flex-shrink:0}

  .cta{display:flex;gap:12px;justify-content:center;margin:44px 0 10px;flex-wrap:wrap}
  .btn{background:var(--amber);color:#fff;border:none;cursor:pointer;font-weight:700;font-size:16px;
       padding:14px 28px;border-radius:11px;text-decoration:none;display:inline-block}
  .btn:hover{background:var(--amber-hover)}
  .btn.ghost{background:none;color:var(--amber);border:2px solid var(--amber)}

  footer{border-top:1px solid var(--line);padding:32px 0;text-align:center;font-size:13px;color:var(--muted);margin-top:36px}
  footer a{color:var(--amber);text-decoration:none;font-weight:600}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="logo" href="index.html">◆ World<span>Constitution</span></a>
    <div class="nav-right">
      <select id="lang" aria-label="Language"></select>
      <a class="back" href="index.html" id="back"></a>
    </div>
  </div>
</nav>

<header class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
</header>

<section class="wrap">
  <h2 id="batt-t"></h2>
  <p class="sub" style="margin:0 0 18px;text-align:start;max-width:none" id="batt-lead"></p>

  <div class="batt">
    <svg viewBox="0 0 340 130" aria-hidden="true">
      <rect x="6" y="18" width="300" height="94" rx="16"
            fill="none" stroke="color-mix(in srgb, var(--muted) 45%, transparent)" stroke-width="4"/>
      <rect x="310" y="50" width="22" height="30" rx="7"
            fill="color-mix(in srgb, var(--muted) 45%, transparent)"/>
      <g id="cells"></g>
    </svg>
    <div class="lvl" id="batt-lvl"></div>
    <div class="hint" id="batt-hint"></div>
  </div>

  <div class="segs" id="segs"></div>

  <div class="glow"><b id="glow-t"></b><span id="glow"></span></div>
</section>

<section class="wrap">
  <h2 id="build-t"></h2>
  <div id="build"></div>

  <h2 id="check-t"></h2>
  <div id="check"></div>

  <h2 id="money-t"></h2>
  <div class="money" id="money"></div>
  <div class="warn"><b id="warn-t"></b><span id="warn"></span></div>

  <h2 id="cant-t"></h2>
  <ul class="cant" id="cant"></ul>

  <div class="cta">
    <a class="btn" href="index.html" id="cta-sign"></a>
    <a class="btn ghost" href="questions.html" id="cta-q"></a>
  </div>
</section>

<footer class="wrap">
  <a href="index.html" id="f-home"></a> · <a href="game.html" id="f-shield"></a> · <a href="https://github.com/murad2026/wc" target="_blank" rel="noopener">GitHub</a>
</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const LANGS = { en:'English', fr:'Français', es:'Español', ru:'Русский', zh:'中文', ar:'العربية' };
let T = null;

function pickLang(){
  const s = localStorage.getItem('wc_lang');
  if(s && LANGS[s]) return s;
  const n = (navigator.language||'en').slice(0,2).toLowerCase();
  return LANGS[n] ? n : 'en';
}

async function setLang(code){
  try{ T = await (await fetch(`lang/${code}.json`)).json(); }
  catch(e){ if(code!=='en') return setLang('en'); return; }
  localStorage.setItem('wc_lang', code);
  document.documentElement.lang = code;
  document.documentElement.dir = T.dir || 'ltr';
  render();
}


/* Заряд читаем из того же хранилища, что и главная страница.
   Сегменты 3-5 появятся, когда заработают дела и гильдии. */
const signed = !!localStorage.getItem('wc_signed');
const LEVEL  = signed ? 1 : 0;   /* сколько сегментов заполнено */

function battery(g){
  const N = 5, x0 = 22, w = 50, gap = 8;
  $('cells').innerHTML = Array.from({length:N}, (_,i) => {
    const on = i < LEVEL;
    const fill = on ? (i === N-1 ? 'var(--green)' : 'var(--amber)')
                    : 'color-mix(in srgb, var(--muted) 12%, transparent)';
    return `<rect x="${x0 + i*(w+gap)}" y="34" width="${w}" height="62" rx="9" fill="${fill}"/>`;
  }).join('');
  $('batt-lvl').textContent  = LEVEL ? g.segs[LEVEL-1].name : g.lvl0;
  $('batt-hint').textContent = LEVEL < N ? g.next.replace('{}', g.segs[LEVEL].name) : g.full;
}

function render(){
  const k = T.k;
  document.title = k.title + ' · WorldConstitution';
  $('back').textContent = T.back;
  $('title').textContent = k.title;
  $('sub').textContent = k.sub;

  const g = T.k;
  $('batt-t').textContent    = g.battT;
  $('batt-lead').textContent = g.battLead;
  battery(g);
  $('segs').innerHTML = g.segs.map((sg,i)=>`
    <div class="seg${i < LEVEL ? ' on' : ''}">
      <div class="dot">${i+1}</div>
      <div>
        <b>${esc(sg.name)}</b>
        <div class="need">${esc(sg.need)}</div>
        <div class="opens"><i>${esc(g.opensL)}</i> ${esc(sg.opens)}</div>
      </div>
    </div>`).join('');
  $('glow-t').textContent = g.glowT;
  $('glow').textContent   = g.glow;
  $('f-shield').textContent = T.g.title;
  $('build-t').textContent = k.buildT;
  $('build').innerHTML = k.build.map((b,i)=>
    `<div class="item"><div class="n">${i+1}</div><div><b>${esc(b.t)}</b><span>${esc(b.d)}</span></div></div>`).join('');

  $('check-t').textContent = k.checkT;
  $('check').innerHTML = k.check.map((c,i)=>
    `<div class="item"><div class="n">${['⚙','◎','✋'][i]||'•'}</div><div><b>${esc(c.t)}</b><span>${esc(c.d)}</span></div></div>`).join('');

  $('money-t').textContent = k.moneyT;
  $('money').innerHTML = k.money.map(p=>`<p>${p}</p>`).join('');
  $('warn-t').textContent = k.warnT;
  $('warn').textContent = k.warn;

  $('cant-t').textContent = k.cantT;
  $('cant').innerHTML = k.cant.map(c=>`<li>${esc(c)}</li>`).join('');

  $('cta-sign').textContent = k.ctaSign;
  $('cta-q').textContent = k.ctaQ;
  $('f-home').textContent = T.back;
}

const sel = $('lang');
sel.innerHTML = Object.entries(LANGS).map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
const initial = pickLang();
sel.value = initial;
sel.addEventListener('change', e => setLang(e.target.value));
setLang(initial);
</script>
</body>
</html>
