<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The experts — Verified.Ninja</title>
<meta name="description" content="Who runs the screens, what clears them for solo work, and what gets someone turned down.">
<link rel="stylesheet" href="app.css">
<style>
  header.top{padding:60px 0 8px}
  header.top .lede{margin-top:18px}

  .who + .who{margin-top:20px}
  .who{margin-top:44px}

  .idhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;
    padding:24px 24px 20px;border-bottom:1px solid var(--line-soft)}
  .ava{width:60px;height:60px;border-radius:17px;flex-shrink:0;background:var(--bg-soft);
    border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:26px}
  .idhead .m{flex:1 1 200px;min-width:0}
  .code{font-size:24px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
  .role{color:var(--muted);font-size:15.5px;margin-top:2px}

  .rows{padding:6px 0}
  .r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
    padding:12px 24px;border-top:1px solid var(--line-soft)}
  .r:first-child{border-top:none}
  .r .k{font-size:15px;color:var(--ink-2)}
  .r .v{font-size:15px;font-weight:500;text-align:end;font-variant-numeric:tabular-nums}
  .r .v.dimv{color:var(--muted);font-weight:400}
  .stack{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .stack span{font-size:12.5px;color:var(--ink-2);background:var(--bg-soft);border-radius:980px;padding:3px 10px}

  .why{padding:15px 24px;background:var(--bg-soft);border-top:1px solid var(--line-soft);
    font-size:14px;color:var(--muted)}

  /* таблица допуска */
  .bar-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;min-width:520px}
  th{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
    text-align:start;padding:14px 22px;background:var(--bg-soft);border-bottom:1px solid var(--line-soft)}
  td{padding:14px 22px;font-size:15px;border-top:1px solid var(--line-soft);vertical-align:top}
  td:first-child{color:var(--ink)}
  td:nth-child(2){font-weight:500;white-space:nowrap}
  td:last-child{color:var(--muted)}

  .list{list-style:none;padding:8px 24px 20px}
  .list li{font-size:15.5px;color:var(--ink-2);padding:9px 0 9px 22px;position:relative;line-height:1.45}
  .list li::before{position:absolute;left:0;color:var(--muted);font-weight:600}
  .list.ev li::before{content:"→"}
  .list.no li::before{content:"✕";color:var(--bad)}

  .sec-t{padding:16px 24px;font-size:12px;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);background:var(--bg-soft);
    border-bottom:1px solid var(--line-soft)}
  .box{border:1px solid var(--line-soft);border-radius:18px;overflow:hidden;
    background:var(--card);margin-top:20px}
  .box p{font-size:15px;padding:18px 24px}

  .cta{padding:66px 0;text-align:center;border-top:1px solid var(--line-soft);margin-top:64px}
  .cta .btns{display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="brand" href="index.html">Verified<b>.Ninja</b></a>
    <div class="nav-links">
      <a href="index.html" class="hide-sm" id="n-home">Overview</a>
      <a href="report.html" class="hide-sm" id="n-report">Sample</a>
      <select class="lang" id="lang" aria-label="Language"></select>
      <a class="btn sm" href="order.html" id="n-order">Order</a>
    </div>
  </div>
</nav>

<header class="top wrap mid">
  <div class="eyebrow" id="kicker"></div>
  <h1 id="title"></h1>
  <p class="lede" id="lede"></p>
</header>

<div class="wrap mid" id="people"></div>

<div class="wrap mid">
  <div class="box" id="evidence"></div>
  <div class="box" id="bar"></div>
  <div class="box" id="reject"></div>
</div>

<section class="cta wrap mid">
  <h2 id="cta-t"></h2>
  <div class="btns">
    <a class="btn" href="order.html" id="cta-1"></a>
    <a class="btn ghost" href="report.html" id="cta-2"></a>
  </div>
</section>

<footer class="wrap mid">
  <div class="row"><span id="f-note"></span></div>
</footer>

<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

/* Значение поля: true/false/не заявлено. Ничего не додумываем. */
function flag(v, e){
  if(v === true)  return `<span class="v">${esc(e.yes)}</span>`;
  if(v === false) return `<span class="v">${esc(e.no)}</span>`;
  return `<span class="v dimv">${esc(e.na)}</span>`;
}
function row(k, inner){ return `<div class="r"><span class="k">${esc(k)}</span>${inner}</div>`; }

window.render = function(T){
  const e = T.experts;
  document.title = e.title + ' — Verified.Ninja';
  $('n-home').textContent   = T.nav.overview;
  $('n-report').textContent = T.nav.sample;
  $('n-order').textContent  = T.nav.order;
  $('kicker').textContent = e.kicker;
  $('title').textContent  = e.title;
  $('lede').textContent   = e.lede;

  $('people').innerHTML = e.people.map(p => {
    const solo = p.solo === 'bar';
    return `
    <div class="who box">
      <div class="idhead">
        <div class="ava">🥷</div>
        <div class="m">
          <div class="code">${esc(p.code)}
            <span class="pill ${solo ? 'ok' : 'mid'}">${esc(solo ? e.soloYes : e.shadowOnly)}</span>
          </div>
          <div class="role">${esc(p.role)}</div>
        </div>
      </div>
      <div class="rows">
        ${row(e.fields.stack, `<span class="stack">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</span>`)}
        ${row(e.fields.years, p.years == null
             ? `<span class="v dimv">${esc(e.na)}</span>`
             : `<span class="v">${esc(String(p.years))}</span>`)}
        ${row(e.fields.interviewing, flag(p.interviewing, e))}
        ${row(e.fields.hired, flag(p.hired, e))}
        ${row(e.fields.ontime, `<span class="v dimv">${esc(e.noData)}</span>`)}
        ${row(e.fields.avg,    `<span class="v dimv">${esc(e.noData)}</span>`)}
      </div>
      <div class="why">${esc(e.soloWhy[p.solo])}</div>
    </div>`;
  }).join('');

  $('evidence').innerHTML = `
    <div class="sec-t">${esc(e.evidenceT)}</div>
    <ul class="list ev">${e.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;

  $('bar').innerHTML = `
    <div class="sec-t">${esc(e.barT)}</div>
    <div class="bar-wrap"><table>
      <thead><tr>${e.barCols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${e.bar.map(b=>`<tr><td>${esc(b.r)}</td><td>${esc(b.s)}</td><td>${esc(b.e)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="sec-t" style="border-top:1px solid var(--line-soft)">${esc(e.examT)}</div>
    <p>${esc(e.exam)}</p>`;

  $('reject').innerHTML = `
    <div class="sec-t">${esc(e.rejectT)}</div>
    <ul class="list no">${e.reject.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <div class="sec-t" style="border-top:1px solid var(--line-soft)">${esc(e.revealT)}</div>
    <p>${esc(e.reveal)}</p>`;

  $('cta-t').textContent = e.ctaT;
  $('cta-1').textContent = e.cta1;
  $('cta-2').textContent = e.cta2;
  $('f-note').textContent = T.footer.note;
};
</script>
</body>
</html>
