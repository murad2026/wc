<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order — Verified.Ninja</title>
<meta name="description" content="Place an order for a technical screen. Order number straight away, payment link once an expert is confirmed.">
<link rel="stylesheet" href="app.css">
<style>
  header.top{padding:56px 0 30px}
  header.top .lede{margin-top:14px;font-size:17px}

  .pick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.pick{grid-template-columns:1fr}}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt label{display:block;background:var(--card);border:1.5px solid var(--line-soft);
    border-radius:16px;padding:20px;cursor:pointer;transition:border-color .15s,background .15s;height:100%}
  .opt label:hover{border-color:var(--line)}
  .opt input:checked + label{border-color:var(--ink);background:var(--bg-soft)}
  .opt input:focus-visible + label{outline:2px solid var(--ink);outline-offset:3px}
  .opt .nm{font-size:16px;font-weight:600}
  .opt .pr{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:7px 0 3px}
  .opt .ds{font-size:13.5px;color:var(--muted);line-height:1.4}

  .note{background:var(--bg-soft);border-radius:14px;padding:17px 19px;font-size:14.5px;color:var(--muted)}
  .note b{color:var(--ink);font-weight:600}
  form > * + *{margin-top:24px}

  /* подтверждение */
  #done{display:none}
  #done.on{display:block}
  .ticket{background:var(--bg-soft);border-radius:20px;padding:34px 28px;text-align:center}
  .ticket .lb{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .ticket .ref{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:clamp(28px,7vw,40px);font-weight:600;letter-spacing:.06em;margin:12px 0 8px}
  .ticket .sv{font-size:14.5px;color:var(--muted)}
  .flow{margin-top:30px;list-style:none;counter-reset:f}
  .flow li{display:flex;gap:15px;padding:15px 0;border-top:1px solid var(--line-soft);
    font-size:15px;color:var(--muted);line-height:1.45}
  .flow li:first-child{border-top:none}
  .flow li::before{counter-increment:f;content:counter(f);flex-shrink:0;width:25px;height:25px;
    border-radius:50%;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center}
  .after{display:flex;gap:18px;justify-content:center;margin-top:28px;flex-wrap:wrap;font-size:14.5px}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="brand" href="index.html">Verified<b>.Ninja</b></a>
    <div class="nav-links">
      <a href="expert.html" class="hide-sm" id="n-exp"></a>
      <a href="report.html" class="hide-sm" id="n-rep"></a>
      <select class="lang" id="lang" aria-label="Language"></select>
      <a href="status.html" id="n-st"></a>
    </div>
  </div>
</nav>

<div class="wrap narrow" id="stage-form">
  <header class="top">
    <h1 id="h1"></h1>
    <p class="lede" id="sub"></p>
  </header>

  <form id="f" novalidate>
    <fieldset>
      <legend id="pick-t"></legend>
      <div class="pick">
        <div class="opt">
          <input type="radio" name="service" id="svc-screen" value="screen" checked>
          <label for="svc-screen">
            <div class="nm" id="p0n"></div>
            <div class="pr" id="p0p"></div>
            <div class="ds" id="p0d"></div>
          </label>
        </div>
        <div class="opt">
          <input type="radio" name="service" id="svc-shadow" value="shadow">
          <label for="svc-shadow">
            <div class="nm" id="p1n"></div>
            <div class="pr" id="p1p"></div>
            <div class="ds" id="p1d"></div>
          </label>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend id="you-t"></legend>
      <div class="field">
        <label class="lb" for="nm" id="l-nm"></label>
        <input type="text" id="nm" autocomplete="name" maxlength="80">
      </div>
      <div class="field">
        <label class="lb" for="em" id="l-em"></label>
        <input type="email" id="em" autocomplete="email" maxlength="120">
        <div class="hint" id="h-em"></div>
      </div>
      <div class="field">
        <label class="lb" for="co" id="l-co"></label>
        <input type="text" id="co" autocomplete="organization" maxlength="80">
      </div>
    </fieldset>

    <fieldset>
      <legend id="role-t"></legend>
      <div class="field">
        <label class="lb" for="rl" id="l-rl"></label>
        <input type="text" id="rl" maxlength="120">
      </div>
      <div class="field">
        <label class="lb" for="cn" id="l-cn"></label>
        <textarea id="cn" maxlength="800"></textarea>
        <div class="hint" id="h-cn"></div>
      </div>
    </fieldset>

    <div class="note" id="note"></div>
    <div class="alert" id="err"></div>
    <button class="btn wide" type="submit" id="go"></button>
    <p class="hint" style="text-align:center" id="nocharge"></p>
  </form>
</div>

<div class="wrap narrow" id="done">
  <header class="top">
    <h1 id="d-t"></h1>
    <p class="lede" id="d-s"></p>
  </header>
  <div class="ticket">
    <div class="lb" id="d-lb"></div>
    <div class="ref" id="ref">—</div>
    <div class="sv" id="d-sv"></div>
  </div>
  <ol class="flow" id="flow"></ol>
  <p class="after">
    <a class="link" href="status.html" id="d-track"></a>
    <a class="link" href="report.html" id="d-sample"></a>
  </p>
</div>

<footer class="wrap narrow">
  <div class="row">
    <span id="f-note"></span>
    <span><a href="about.html" id="f-about"></a> · <a href="join.html" id="f-join"></a></span>
  </div>
</footer>

<script src="i18n.js"></script>
<script>
const SB = {
  url:  "https://nhkwgulokiwqwfrynmkx.supabase.co",
  anon: "sb_publishable_XFFU01VfekhRJffwEEgbwA_eOvmOXr0"
};
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };
let T = null;

/* Номер заказа: шесть символов без пар, которые путают на слух и на глаз
   (ноль и O, единица и I), чтобы его можно было продиктовать по телефону. */
function makeRef(){
  const A = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  const b = new Uint8Array(6);
  crypto.getRandomValues(b);
  return 'VN-' + [...b].map(n => A[n % A.length]).join('');
}

function fail(msg){
  $('err').textContent = msg;
  $('err').classList.add('on');
  $('go').disabled = false;
  $('go').textContent = T.order.go;
}

window.render = function(t){
  T = t;
  const o = T.order, h = T.home;
  document.title = o.h1 + ' — Verified.Ninja';
  $('n-exp').textContent = T.nav.experts;
  $('n-rep').textContent = T.nav.sample;
  $('n-st').textContent  = T.nav.status;

  $('h1').textContent  = o.h1;
  $('sub').textContent = o.sub;
  $('pick-t').textContent = o.pickT;
  h.plans.forEach((p,i)=>{
    $('p'+i+'n').textContent = p.name;
    $('p'+i+'p').textContent = p.price;
    $('p'+i+'d').textContent = p.when;
  });

  $('you-t').textContent = o.youT;
  $('l-nm').textContent = o.name;
  $('l-em').textContent = o.email;
  $('h-em').textContent = o.emailHint;
  $('l-co').innerHTML   = esc(o.company) + ' <span>— ' + esc(o.optional) + '</span>';
  $('role-t').textContent = o.roleT;
  $('l-rl').textContent = o.role;
  $('rl').placeholder   = o.rolePh;
  $('l-cn').innerHTML   = esc(o.concern) + ' <span>— ' + esc(o.concernOpt) + '</span>';
  $('cn').placeholder   = o.concernPh;
  $('h-cn').textContent = o.concernHint;
  $('note').textContent = o.note;
  $('go').textContent   = o.go;
  $('nocharge').textContent = o.noCharge;

  $('d-t').textContent  = o.doneT;
  $('d-s').textContent  = o.doneS;
  $('d-lb').textContent = o.refLbl;
  $('flow').innerHTML   = o.next.map(x=>`<li>${esc(x)}</li>`).join('');
  $('d-track').textContent  = o.track;
  $('d-sample').textContent = o.seeSample;
  $('f-note').textContent = T.footer.note;
  if($('f-about')) $('f-about').textContent = T.nav.about;
  if($('f-join'))  $('f-join').textContent  = T.nav.join;

  /* Услуга может быть выбрана ссылкой с главной. */
  const pre = new URLSearchParams(location.search).get('s');
  if(pre === 'shadow') $('svc-shadow').checked = true;
};

$('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  $('err').classList.remove('on');
  const o = T.order;

  const service = document.querySelector('input[name=service]:checked').value;
  const client_name  = $('nm').value.trim();
  const client_email = $('em').value.trim();
  const role_hiring  = $('rl').value.trim();

  if(client_name.length < 2) return fail(o.errName);
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(client_email)) return fail(o.errEmail);
  if(role_hiring.length < 2) return fail(o.errRole);

  $('go').disabled = true;
  $('go').textContent = o.going;

  const ref = makeRef();
  try{
    const r = await fetch(`${SB.url}/rest/v1/orders`, {
      method:'POST',
      headers:{ apikey:SB.anon, Authorization:`Bearer ${SB.anon}`,
                'Content-Type':'application/json', Prefer:'return=minimal' },
      body: JSON.stringify({
        ref, service, client_name, client_email, role_hiring,
        company: $('co').value.trim() || null,
        concern: $('cn').value.trim() || null
      })
    });
    if(!r.ok) return fail(o.errSave);
  }catch(e){
    return fail(o.errNet);
  }

  try{ localStorage.setItem('vn_ref', ref); }catch(e){}
  const plan = T.home.plans.find(p => p.id === service);
  $('ref').textContent  = ref;
  $('d-sv').textContent = plan.name + ' · ' + plan.price;
  $('d-track').href = 'status.html?ref=' + encodeURIComponent(ref);
  $('stage-form').style.display = 'none';
  $('done').classList.add('on');
  window.scrollTo(0,0);
});
</script>
</body>
</html>
