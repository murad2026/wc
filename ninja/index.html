<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified.Ninja — technical screening by senior engineers</title>
<meta name="description" content="A senior engineer with FAANG-scale hiring experience interviews your candidate — 30 or 60 minutes — and writes up what they found. From $349 per candidate.">
<meta property="og:title" content="Verified.Ninja — technical screening by senior engineers">
<meta property="og:description" content="A live technical interview run by a senior engineer. Phone screening $349, full interview $599, written assessment in 48 hours.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M16%202.5a13.5%2013.5%200%201%200%200%2027%2013.5%2013.5%200%200%200%200-27ZM9%2012.5h14a2.8%202.8%200%200%201%200%205.6H9a2.8%202.8%200%200%201%200-5.6ZM11.2%2015.3a1.6%201.6%200%201%200%203.2%200%201.6%201.6%200%201%200-3.2%200ZM17.6%2015.3a1.6%201.6%200%201%200%203.2%200%201.6%201.6%200%201%200-3.2%200Z%22%20fill%3D%22%231d1d1f%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="app.css">
<style>
  header.hero{padding:84px 0 84px;text-align:center}
  header.hero .mark-lg{margin-bottom:26px}
  header.hero .lede{margin:22px auto 0}
  .hero-btns{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap}
  .hero-meta{margin-top:26px;font-size:14px;color:var(--muted)}

  /* кто проверяет */
  .who-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
  @media(max-width:680px){.who-cards{grid-template-columns:1fr}}
  .pc{display:flex;gap:16px;align-items:flex-start;transition:border-color .15s}
  .pc:hover{border-color:var(--line)}
  .pc .av{width:52px;height:52px;border-radius:15px;flex-shrink:0;background:var(--bg-soft);
    border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink)}
  .pc .av .mark{width:24px;height:24px}
  .pc .bd{min-width:0}
  .pc .cd{display:block;font-size:19px;font-weight:600;letter-spacing:-.015em}
  .pc .rl{display:block;font-size:14px;color:var(--muted);margin-top:1px}
  .pc .sc{display:flex;align-items:baseline;gap:7px;margin-top:12px}
  
  .who-link{margin-top:22px}

  /* шаги */
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1px;
    background:var(--line-soft);border:1px solid var(--line-soft);border-radius:18px;overflow:hidden}
  .st{background:var(--card);padding:26px 22px}
  .st .n{width:27px;height:27px;border-radius:50%;background:var(--ink);color:var(--bg);
    font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-bottom:15px}
  .st b{display:block;font-size:16px;font-weight:600;margin-bottom:6px}
  .st span{font-size:14.5px;color:var(--muted)}

  /* цены */
  .plans{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:720px){.plans{grid-template-columns:1fr}}
  .plan{background:var(--card);border:1px solid var(--line-soft);border-radius:20px;padding:30px 26px;
    display:flex;flex-direction:column}
  .plan.lead{border-color:var(--ink)}
  .plan .pn{font-size:19px;font-weight:600;letter-spacing:-.015em}
  .plan .pp{font-size:44px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:12px}
  .plan .pu{font-size:14px;color:var(--muted);margin-top:5px}
  .plan .pw{font-size:14.5px;color:var(--ink-2);margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
  .plan ul{list-style:none;margin-top:16px;flex:1}
  .plan li{font-size:14.5px;color:var(--muted);padding:7px 0 7px 22px;position:relative;line-height:1.45}
  .plan li::before{content:"✓";position:absolute;left:0;color:var(--ink);font-weight:600}
  .plan .btn{margin-top:22px}

  .more{margin-top:34px}
  .more-t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px}
  .more-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
  .mi{background:var(--bg-soft);border-radius:14px;padding:19px}
  .mi b{display:block;font-size:15.5px;font-weight:600;margin-bottom:5px}
  .mi span{font-size:14px;color:var(--muted)}
  .more-n{font-size:13.5px;color:var(--muted);margin-top:14px}

  /* вопросы */
  details{border-bottom:1px solid var(--line-soft)}
  details:first-of-type{border-top:1px solid var(--line-soft)}
  summary{cursor:pointer;list-style:none;padding:20px 0;font-size:17px;font-weight:500;
    display:flex;justify-content:space-between;gap:20px;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--muted);font-size:22px;font-weight:300;flex-shrink:0}
  details[open] summary::after{content:"–"}
  details .a{padding:0 0 22px;font-size:15.5px;color:var(--muted);max-width:44em}

  .final{text-align:center;padding:92px 0}
  .final .lede{margin:16px auto 0}
  .final .btn{margin-top:30px}
  .final .nt{margin-top:18px;font-size:13.5px;color:var(--muted)}
  .disc{font-size:12.5px;color:var(--muted);text-align:center;max-width:44em;margin:26px auto 0}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="brand" href="index.html">Verified<b>.Ninja</b><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M16 2.5a13.5 13.5 0 1 0 0 27 13.5 13.5 0 0 0 0-27ZM9 12.5h14a2.8 2.8 0 0 1 0 5.6H9a2.8 2.8 0 0 1 0-5.6ZM11.2 15.3a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0ZM17.6 15.3a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0Z" fill="currentColor"/></svg></a>
    <div class="nav-links">
      <a href="expert.html" class="hide-sm" id="n-exp"></a>
      <a href="report.html" class="hide-sm" id="n-rep"></a>
      <a href="#pricing" class="hide-sm" id="n-pri"></a>
      <select class="lang" id="lang" aria-label="Language"></select>
      <a class="btn sm" href="order.html" id="n-ord"></a>
    </div>
  </div>
</nav>

<header class="hero wrap">
  <svg class="mark-lg" viewBox="0 0 32 32" aria-hidden="true"><g stroke="currentColor" stroke-linecap="round" fill="none"><line x1="24.8" y1="7.2" x2="30" y2="2" stroke-width="2.2"/><line x1="7.2" y1="24.8" x2="3" y2="29" stroke-width="2.8"/><line x1="6.1" y1="23.1" x2="8.9" y2="25.9" stroke-width="1.8"/></g><path fill-rule="evenodd" clip-rule="evenodd" d="M16 5.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21ZM10.5 13.6h11a2.2 2.2 0 0 1 0 4.4h-11a2.2 2.2 0 0 1 0-4.4ZM12.6 15.8a1.25 1.25 0 1 0 2.5 0 1.25 1.25 0 1 0-2.5 0ZM17.4 15.8a1.25 1.25 0 1 0 2.5 0 1.25 1.25 0 1 0-2.5 0Z" fill="currentColor"/></svg>
  <h1 id="h1"></h1>
  <p class="lede" id="sub"></p>
  <div class="hero-btns">
    <a class="btn" href="order.html" id="cta1"></a>
    <a class="btn ghost" href="report.html" id="cta2"></a>
  </div>
  <p class="hero-meta" id="meta"></p>
</header>

<section class="wrap">
  <div class="sec-head">
    <div class="eyebrow" id="who-k"></div>
    <h2 id="who-t"></h2>
    <p id="who-s"></p>
  </div>
  <div class="who-cards" id="who-cards"></div>
  <p class="who-link"><a class="link" href="expert.html" id="who-cta"></a></p>
</section>

<section class="wrap">
  <div class="sec-head">
    <h2 id="how-t"></h2>
    <p id="how-s"></p>
  </div>
  <div class="steps" id="steps"></div>
</section>

<section class="wrap" id="pricing">
  <div class="sec-head">
    <h2 id="price-t"></h2>
    <p id="price-s"></p>
  </div>
  <div class="plans" id="plans"></div>
  <div class="more">
    <div class="more-t" id="more-t"></div>
    <div class="more-g" id="more-g"></div>
    <p class="more-n" id="more-n"></p>
  </div>
  <p class="disc" id="disc"></p>
</section>

<section class="wrap mid">
  <div class="sec-head"><h2 id="faq-t"></h2></div>
  <div id="faq"></div>
</section>

<section class="final wrap mid">
  <h2 id="final-t"></h2>
  <p class="lede" id="final-s"></p>
  <a class="btn" href="order.html" id="final-cta"></a>
  <p class="nt" id="final-n"></p>
</section>

<footer class="wrap">
  <div class="row">
    <span id="f-note"></span>
    <span><a href="about.html" id="f-about"></a> · <a href="join.html" id="f-join"></a></span>
  </div>
</footer>

<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

window.render = function(T){
  const h = T.home, e = T.experts;
  $('n-exp').textContent = T.nav.experts;
  $('n-rep').textContent = T.nav.sample;
  $('n-pri').textContent = T.nav.pricing;
  $('n-ord').textContent = T.nav.order;

  $('h1').textContent  = h.h1;
  $('sub').textContent = h.sub;
  $('cta1').textContent = h.cta1;
  $('cta2').textContent = h.cta2;
  $('meta').textContent = h.meta;

  $('who-k').textContent = h.whoK;
  $('who-t').textContent = h.whoT;
  $('who-s').textContent = h.whoS;
  $('who-cta').textContent = h.whoCta;

  /* Карточка публичная и короткая: код, роль, допуск. Ничего лишнего. */
  $('who-cards').innerHTML = e.people.map(p => {
    const solo = p.solo === 'bar';
    return `<a class="card pc" href="expert.html">
      <span class="av"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M16 2.5a13.5 13.5 0 1 0 0 27 13.5 13.5 0 0 0 0-27ZM9 12.5h14a2.8 2.8 0 0 1 0 5.6H9a2.8 2.8 0 0 1 0-5.6ZM11.2 15.3a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0ZM17.6 15.3a1.6 1.6 0 1 0 3.2 0 1.6 1.6 0 1 0-3.2 0Z" fill="currentColor"/></svg></span>
      <span class="bd">
        <span class="cd">${esc(p.code)}</span>
        <span class="rl">${esc(p.role)}</span>
        <span class="sc"><span class="pill ${solo ? 'ok' : 'mid'}">${esc(solo ? e.soloYes : e.shadowOnly)}</span></span>
      </span>
    </a>`;
  }).join('');

  $('how-t').textContent = h.howT;
  $('how-s').textContent = h.howS;
  $('steps').innerHTML = h.steps.map((s,i)=>`
    <div class="st"><div class="n">${i+1}</div><b>${esc(s.t)}</b><span>${esc(s.d)}</span></div>`).join('');

  $('price-t').textContent = h.priceT;
  $('price-s').textContent = h.priceS;
  $('plans').innerHTML = h.plans.map((p,i)=>`
    <div class="plan${i===0?' lead':''}">
      <div class="pn">${esc(p.name)}</div>
      <div class="pp">${esc(p.price)}</div>
      <div class="pu">${esc(p.per)}</div>
      <div class="pw">${esc(p.when)}</div>
      <ul>${p.f.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
      <a class="btn${i===0?'':' ghost'}" href="order.html?s=${encodeURIComponent(p.id)}">${esc(p.cta)}</a>
    </div>`).join('');

  $('more-t').textContent = h.moreT;
  $('more-g').innerHTML = h.more.map(m=>`<div class="mi"><b>${esc(m.t)}</b><span>${esc(m.d)}</span></div>`).join('');
  $('more-n').textContent = h.moreNote;
  $('disc').textContent = T.footer.note;

  $('faq-t').textContent = h.faqT;
  $('faq').innerHTML = h.faq.map(f=>`
    <details><summary>${esc(f.q)}</summary><div class="a">${esc(f.a)}</div></details>`).join('');

  $('final-t').textContent = h.finalT;
  $('final-s').textContent = h.finalS;
  $('final-cta').textContent = h.finalCta;
  $('final-n').textContent = h.finalNote;
  $('f-note').textContent = T.footer.note;
  if($('f-about')) $('f-about').textContent = T.nav.about;
  if($('f-join'))  $('f-join').textContent  = T.nav.join;
};
</script>
</body>
</html>
